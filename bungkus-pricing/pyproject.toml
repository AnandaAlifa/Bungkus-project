[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bungkus-pricing"
version = "1.0.0"
description = "Deterministic Dynamic Pricing Engine for Bungkus! near-expiry food clearance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Bungkus Engineering Team" }
]
keywords = ["pricing", "dynamic-pricing", "food-waste", "clearance", "indonesia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
