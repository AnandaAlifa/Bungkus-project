[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bungkus-groupbuy"
version = "1.0.0"
description = "Event-Driven Group Buy State Engine for Bungkus! flash sales"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Bungkus Engineering Team" }
]
keywords = ["group-buy", "flash-sale", "distributed-systems", "redis", "state-machine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0.0",
    "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "fakeredis[lua]>=2.0.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
